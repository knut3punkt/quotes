[versions]
# Android Gradle Plugin — see https://developer.android.com/build/releases/agp-9-2-0-release-notes
# 9.2.1 is a same-line patch (R8 crash fix) with unchanged Gradle/JDK requirements.
agp = "9.3.1"
# Kotlin — see https://kotlinlang.org/docs/releases.html (used by the server module and the
# Compose compiler plugin; tv-app's Android compilation itself uses AGP's built-in Kotlin support)
kotlin = "2.4.10"
# Jetpack Compose BOM — see https://developer.android.com/jetpack/androidx/releases/compose-bom
composeBom = "2026.06.01"
# Compose for TV — see https://developer.android.com/jetpack/androidx/releases/tv
tvMaterial = "1.1.0"
tvFoundation = "1.0.0"
# AndroidX libraries not covered by the Compose BOM
androidxCoreKtx = "1.19.0"
androidxActivityCompose = "1.13.0"
androidxLifecycleRuntimeKtx = "2.11.0"
# AndroidX test libraries
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
# Ktor — see https://ktor.io/docs/releases.html
ktor = "3.5.2"
# kotlinx.serialization — see https://kotlinlang.org/docs/serialization.html
kotlinxSerialization = "1.11.0"
# Logback (SLF4J backend for the server) — see https://logback.qos.ch/download.html
logback = "1.6.1"
# JetBrains Exposed — see https://www.jetbrains.com/help/exposed/
exposed = "1.4.0"
# Flyway — see https://documentation.red-gate.com/fd/release-notes-for-flyway-engine-179732572.html
flyway = "13.2.0"
# HikariCP — see https://github.com/brettwooldridge/HikariCP
hikaricp = "7.1.0"
# PostgreSQL JDBC driver — see https://jdbc.postgresql.org/
postgresql = "42.7.13"
# jsoup HTML parser — see https://jsoup.org/download
jsoup = "1.23.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycleRuntimeKtx" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }

androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }

kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

ktor-server-core = { group = "io.ktor", name = "ktor-server-core" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
