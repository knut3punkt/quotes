ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ no.esotericgames.quotes.server.ApplicationKt.module ]
    }
}

storage {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "quotes"
    database = ${?DB_NAME}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}

extraction {
    llm {
        baseUrl = "http://localhost:8888"
        baseUrl = ${?EXTRACTION_LLM_BASE_URL}
        model = "local-model"
        model = ${?EXTRACTION_LLM_MODEL}
        temperature = 0.1
        temperature = ${?EXTRACTION_LLM_TEMPERATURE}
        maxOutputTokens = 800
        maxOutputTokens = ${?EXTRACTION_LLM_MAX_OUTPUT_TOKENS}
        requestTimeoutMillis = 30000
        requestTimeoutMillis = ${?EXTRACTION_LLM_TIMEOUT_MILLIS}
        # Optional passthrough to the model/server's reasoning-effort control, e.g. "low"/"medium"/"high".
        # Left unset by default (no reasoningEffort key) so no such field is sent at all.
        # reasoningEffort = ${?EXTRACTION_LLM_REASONING_EFFORT}
    }
    # The judge pass: a separate, strict review of every selected candidate (see
    # docs/features/quote-extraction.md). Configured separately so it can use a different, typically
    # stronger model than the selector. baseUrl and model are deliberately left unset here so they
    # inherit the selector's (extraction.llm) values unless explicitly overridden.
    judge {
        baseUrl = ${?EXTRACTION_JUDGE_LLM_BASE_URL}
        model = ${?EXTRACTION_JUDGE_LLM_MODEL}
        temperature = 0.1
        temperature = ${?EXTRACTION_JUDGE_LLM_TEMPERATURE}
        maxOutputTokens = 500
        maxOutputTokens = ${?EXTRACTION_JUDGE_LLM_MAX_OUTPUT_TOKENS}
        requestTimeoutMillis = 60000
        requestTimeoutMillis = ${?EXTRACTION_JUDGE_LLM_TIMEOUT_MILLIS}
        # reasoningEffort = ${?EXTRACTION_JUDGE_LLM_REASONING_EFFORT}
    }
    # Score thresholds apply to the judge's 1-5 levels, stored as 0/25/50/75/100: 75 means "level 4 or better".
    policy {
        minSourceWords = 55
        minSourceWords = ${?EXTRACTION_MIN_SOURCE_WORDS}
        preferredMinWords = 12
        preferredMinWords = ${?EXTRACTION_PREFERRED_MIN_WORDS}
        preferredMaxWords = 45
        preferredMaxWords = ${?EXTRACTION_PREFERRED_MAX_WORDS}
        acceptableMinWords = 6
        acceptableMinWords = ${?EXTRACTION_ACCEPTABLE_MIN_WORDS}
        acceptableMaxWords = 60
        acceptableMaxWords = ${?EXTRACTION_ACCEPTABLE_MAX_WORDS}
        minIndependence = 75
        minIndependence = ${?EXTRACTION_MIN_INDEPENDENCE}
        minCompleteness = 75
        minCompleteness = ${?EXTRACTION_MIN_COMPLETENESS}
        minContextualFidelity = 75
        minContextualFidelity = ${?EXTRACTION_MIN_CONTEXTUAL_FIDELITY}
        minQuotability = 75
        minQuotability = ${?EXTRACTION_MIN_QUOTABILITY}
    }
}

interpretation {
    llm {
        baseUrl = "http://localhost:8888"
        baseUrl = ${?INTERPRETATION_LLM_BASE_URL}
        model = "local-model"
        model = ${?INTERPRETATION_LLM_MODEL}
        temperature = 0.5
        temperature = ${?INTERPRETATION_LLM_TEMPERATURE}
        maxOutputTokens = 1400
        maxOutputTokens = ${?INTERPRETATION_LLM_MAX_OUTPUT_TOKENS}
        requestTimeoutMillis = 30000
        requestTimeoutMillis = ${?INTERPRETATION_LLM_TIMEOUT_MILLIS}
        # Optional passthrough to the model/server's reasoning-effort control, e.g. "low"/"medium"/"high".
        # Left unset by default (no reasoningEffort key) so no such field is sent at all.
        # reasoningEffort = ${?INTERPRETATION_LLM_REASONING_EFFORT}
    }
}

tagging {
    llm {
        baseUrl = "http://localhost:8888"
        baseUrl = ${?TAGGING_LLM_BASE_URL}
        model = "local-model"
        model = ${?TAGGING_LLM_MODEL}
        temperature = 0.2
        temperature = ${?TAGGING_LLM_TEMPERATURE}
        maxOutputTokens = 900
        maxOutputTokens = ${?TAGGING_LLM_MAX_OUTPUT_TOKENS}
        requestTimeoutMillis = 30000
        requestTimeoutMillis = ${?TAGGING_LLM_TIMEOUT_MILLIS}
        # Optional passthrough to the model/server's reasoning-effort control, e.g. "low"/"medium"/"high".
        # reasoningEffort = ${?TAGGING_LLM_REASONING_EFFORT}
    }
    # Per-subject tag caps, and how many existing tags per facet the prompt shows as the vocabulary to prefer.
    policy {
        maxConcepts = 9
        maxMoods = 2
        maxMotifs = 3
        conceptHintSize = 150
        moodHintSize = 60
        motifHintSize = 80
    }
}
