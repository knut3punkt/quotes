ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ no.esotericgames.quotes.server.ApplicationKt.module ]
    }
}

storage {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "quotes"
    database = ${?DB_NAME}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}

extraction {
    llm {
        baseUrl = "http://localhost:8888"
        baseUrl = ${?EXTRACTION_LLM_BASE_URL}
        model = "local-model"
        model = ${?EXTRACTION_LLM_MODEL}
        temperature = 0.1
        temperature = ${?EXTRACTION_LLM_TEMPERATURE}
        maxOutputTokens = 800
        maxOutputTokens = ${?EXTRACTION_LLM_MAX_OUTPUT_TOKENS}
        requestTimeoutMillis = 30000
        requestTimeoutMillis = ${?EXTRACTION_LLM_TIMEOUT_MILLIS}
        # Optional passthrough to the model/server's reasoning-effort control, e.g. "low"/"medium"/"high".
        # Left unset by default (no reasoningEffort key) so no such field is sent at all.
        # reasoningEffort = ${?EXTRACTION_LLM_REASONING_EFFORT}
    }
    policy {
        minSourceWords = 55
        minSourceWords = ${?EXTRACTION_MIN_SOURCE_WORDS}
        preferredMinWords = 12
        preferredMinWords = ${?EXTRACTION_PREFERRED_MIN_WORDS}
        preferredMaxWords = 45
        preferredMaxWords = ${?EXTRACTION_PREFERRED_MAX_WORDS}
        acceptableMinWords = 6
        acceptableMinWords = ${?EXTRACTION_ACCEPTABLE_MIN_WORDS}
        acceptableMaxWords = 60
        acceptableMaxWords = ${?EXTRACTION_ACCEPTABLE_MAX_WORDS}
        minIndependence = 80
        minIndependence = ${?EXTRACTION_MIN_INDEPENDENCE}
        minCompleteness = 80
        minCompleteness = ${?EXTRACTION_MIN_COMPLETENESS}
        minContextualFidelity = 85
        minContextualFidelity = ${?EXTRACTION_MIN_CONTEXTUAL_FIDELITY}
        minQuotability = 65
        minQuotability = ${?EXTRACTION_MIN_QUOTABILITY}
    }
}
